name: PR Automation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  ci-tests:
    name: PR Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  auto-approve:
    name: Auto Approve PR
    runs-on: ubuntu-latest
    needs: ci-tests
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: read
      pull-requests: write
    env:
      AUTO_APPROVE_ACTOR: dependabot[bot]
      APPROVE_ON_CI_PASS: 'false'
    steps:
      - name: Auto-approve when eligible
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const actor = pr.user.login;
            const allowActor = process.env.AUTO_APPROVE_ACTOR;
            const approveOnCiPass = process.env.APPROVE_ON_CI_PASS === 'true';
            const shouldApprove = actor === allowActor || approveOnCiPass;

            if (!shouldApprove) {
              core.notice(`Skipping approval for @${actor}`);
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const alreadyApprovedByActions = reviews.some(
              (r) => r.user?.login === 'github-actions[bot]' && r.state === 'APPROVED'
            );

            if (alreadyApprovedByActions) {
              core.notice('PR already approved by github-actions[bot].');
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              event: 'APPROVE',
              body: `Auto-approved: tests passed${actor === allowActor ? ` and author is @${allowActor}` : ''}.`,
            });

  enable-auto-merge:
    name: Enable Auto Merge (Squash)
    runs-on: ubuntu-latest
    needs: [ci-tests, auto-approve]
    # Guardrail: never auto-merge into `main` (release PRs must be merged by a human).
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'develop' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Ensure GitHub CLI is available
        run: gh --version

      - name: Enable auto-merge with squash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash
