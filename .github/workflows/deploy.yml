# Purpose: Build and deploy static export to Hostinger via SSH.
name: Build and Deploy (Hostinger Node.js)

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-and-deploy:
    if: ${{ secrets.HOSTINGER_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build:static
        env:
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_WHATSAPP_MESSAGE: ${{ secrets.NEXT_PUBLIC_WHATSAPP_MESSAGE }}

      - name: Determine deploy target
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          if [ "$BRANCH" = "develop" ]; then
            echo "TARGET_PATH=${{ secrets.HOSTINGER_DEPLOY_PATH_PREVIEW }}" >> $GITHUB_ENV
            echo "Deploying develop to ${{ secrets.HOSTINGER_DEPLOY_PATH_PREVIEW }}"
          else
            echo "TARGET_PATH=${{ secrets.HOSTINGER_DEPLOY_PATH_PROD }}" >> $GITHUB_ENV
            echo "Deploying main to ${{ secrets.HOSTINGER_DEPLOY_PATH_PROD }}"
          fi

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Hostinger (rsync)
        run: |
          echo "Deploy path: $TARGET_PATH"
          rsync -avz --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".github" \
            --exclude "reference" \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }}" ./out/ "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:$TARGET_PATH/"

      - name: Install server dependencies and restart
        if: ${{ secrets.HOSTINGER_RESTART_CMD != '' }}
        run: |
          ssh -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "cd $TARGET_PATH && npm ci --omit=dev && ${{ secrets.HOSTINGER_RESTART_CMD }}"

