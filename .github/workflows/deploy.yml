name: Build and Deploy (Hostinger Node.js)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    if: ${{ secrets.HOSTINGER_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Determine deploy target
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "TARGET_PATH=${{ secrets.HOSTINGER_DEPLOY_PATH }}" >> $GITHUB_ENV
          echo "Deploying branch $BRANCH to ${{ secrets.HOSTINGER_DEPLOY_PATH }}"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Hostinger (rsync)
        run: |
          echo "Deploy path: $TARGET_PATH"
          rsync -avz --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".github" \
            --exclude "reference" \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }}" ./ "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:$TARGET_PATH/"

      - name: Install server dependencies and restart
        if: ${{ secrets.HOSTINGER_RESTART_CMD != '' }}
        run: |
          ssh -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "cd $TARGET_PATH && npm ci --omit=dev && ${{ secrets.HOSTINGER_RESTART_CMD }}"

