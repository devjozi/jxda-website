# Purpose: Build static export and deploy to Hostinger via SSH.
# This workflow builds Next.js in static export mode and deploys /out directory to Hostinger.
# Works with Hostinger Premium (static hosting). No Node.js server needed.
name: Build & Deploy Static (Hostinger)

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build:static
        env:
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_WHATSAPP_MESSAGE: ${{ secrets.NEXT_PUBLIC_WHATSAPP_MESSAGE }}
          NEXT_PUBLIC_CONTACT_FORM_ACTION: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ACTION }}

      - name: Determine deploy target
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          if [ "$BRANCH" = "develop" ]; then
            echo "TARGET_PATH=${{ secrets.HOSTINGER_DEPLOY_PATH_PREVIEW }}" >> $GITHUB_ENV
            echo "Deploying develop to ${{ secrets.HOSTINGER_DEPLOY_PATH_PREVIEW }}"
          else
            echo "TARGET_PATH=${{ secrets.HOSTINGER_DEPLOY_PATH_PROD }}" >> $GITHUB_ENV
            echo "Deploying main to ${{ secrets.HOSTINGER_DEPLOY_PATH_PROD }}"
          fi

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Hostinger (rsync)
        run: |
          echo "Deploy path: $TARGET_PATH"
          rsync -avz --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".github" \
            --exclude "reference" \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }}" ./out/ "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:$TARGET_PATH/"

      - name: Verify deployment
        run: |
          echo "✓ Static files deployed to Hostinger"
          echo "Branch: $BRANCH"
          echo "Deploy target: $TARGET_PATH"

